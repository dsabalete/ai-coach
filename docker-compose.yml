version: "3.8"

services:
  coach-bot:
    build: .
    container_name: coach-motivacional-bot
    restart: unless-stopped

    # Variables de entorno
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TZ=Europe/Madrid # Ajusta tu zona horaria

    # Archivos de configuración
    env_file:
      - .env

    # Volúmenes para persistencia (usando volúmenes Docker locales como fallback)
    volumes:
      - coach-bot-data:/app/data
      - coach-bot-logs:/app/logs
      - coach-bot-backups:/app/backups

    # Configuración de red
    networks:
      - coach-network

    # Límites de recursos para Raspberry Pi (Docker Compose standalone)
    mem_limit: 512m
    cpus: 0.5

    # Configuración de logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Labels para Portainer
    labels:
      - "traefik.enable=false"
      - "portainer.group=coaching"
      - "portainer.description=Bot de coaching motivacional personal"

  # Servicio para monitoreo web con logs reales
  coach-monitor:
    build:
      context: ./monitor
      dockerfile: Dockerfile
    container_name: coach-bot-monitor
    restart: unless-stopped

    ports:
      - "8081:80"

    volumes:
      - ./monitor/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./monitor/index.html:/usr/share/nginx/html/index.html:ro
      - ./monitor/logs-real.html:/usr/share/nginx/html/logs.html:ro
      - coach-bot-logs:/usr/share/nginx/html/logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - coach-network

    depends_on:
      - coach-bot

    labels:
      - "portainer.group=coaching"
      - "portainer.description=Monitor web para logs del bot"

networks:
  coach-network:
    driver: bridge
    name: coach-network

volumes:
  coach-bot-data:
    driver: local
  coach-bot-logs:
    driver: local
  coach-bot-backups:
    driver: local
