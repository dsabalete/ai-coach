<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Bot - Logs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            min-height: 100vh;
        }

        .header {
            background: #2d2d30;
            padding: 15px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #ffffff;
            font-size: 1.5em;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #1177bb;
        }

        .btn.secondary {
            background: #5a5a5a;
        }

        .btn.secondary:hover {
            background: #6a6a6a;
        }

        .btn.danger {
            background: #d73a49;
        }

        .btn.danger:hover {
            background: #e53e3e;
        }

        .log-container {
            padding: 20px;
            height: calc(100vh - 80px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .log-filters {
            background: #2d2d30;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-size: 14px;
            color: #cccccc;
        }

        select,
        input {
            padding: 6px 10px;
            background: #3c3c3c;
            border: 1px solid #5a5a5a;
            border-radius: 4px;
            color: #d4d4d4;
            font-size: 14px;
        }

        .log-viewer {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.4;
            overflow-y: auto;
            flex: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .log-line {
            margin-bottom: 2px;
            padding: 2px 0;
        }

        .log-line.info {
            color: #4fc3f7;
        }

        .log-line.warn {
            color: #ffb74d;
        }

        .log-line.error {
            color: #f48fb1;
            background: rgba(244, 143, 177, 0.1);
            padding: 4px;
            border-radius: 3px;
        }

        .log-line.debug {
            color: #81c784;
        }

        .timestamp {
            color: #9e9e9e;
            font-weight: normal;
        }

        .log-level {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
        }

        .level-info {
            background: rgba(79, 195, 247, 0.2);
            color: #4fc3f7;
        }

        .level-warn {
            background: rgba(255, 183, 77, 0.2);
            color: #ffb74d;
        }

        .level-error {
            background: rgba(244, 143, 177, 0.2);
            color: #f48fb1;
        }

        .level-debug {
            background: rgba(129, 199, 132, 0.2);
            color: #81c784;
        }

        .status-bar {
            background: #2d2d30;
            padding: 8px 15px;
            border-top: 1px solid #3e3e42;
            font-size: 12px;
            color: #cccccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .auto-scroll {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .loading {
            text-align: center;
            color: #9e9e9e;
            padding: 20px;
        }

        .no-logs {
            text-align: center;
            color: #9e9e9e;
            padding: 40px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🤖 Coach Bot - Logs en Tiempo Real</h1>
        <div class="controls">
            <button class="btn secondary" onclick="toggleAutoRefresh()">
                <span id="autoRefreshText">⏸️ Pausar</span>
            </button>
            <button class="btn" onclick="refreshLogs()">🔄 Actualizar</button>
            <button class="btn danger" onclick="clearLogs()">🗑️ Limpiar</button>
            <a href="/" class="btn secondary">← Volver</a>
        </div>
    </div>

    <div class="log-container">
        <div class="log-filters">
            <div class="filter-group">
                <label>Nivel:</label>
                <select id="levelFilter" onchange="filterLogs()">
                    <option value="">Todos</option>
                    <option value="INFO">INFO</option>
                    <option value="WARN">WARN</option>
                    <option value="ERROR">ERROR</option>
                    <option value="DEBUG">DEBUG</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Buscar:</label>
                <input type="text" id="searchFilter" placeholder="Filtrar logs..." onkeyup="filterLogs()">
            </div>
            <div class="filter-group">
                <label>Líneas:</label>
                <select id="linesLimit" onchange="refreshLogs()">
                    <option value="100">100</option>
                    <option value="500" selected>500</option>
                    <option value="1000">1000</option>
                    <option value="all">Todos</option>
                </select>
            </div>
        </div>

        <div class="log-viewer" id="logViewer">
            <div class="loading">Cargando logs...</div>
        </div>
    </div>

    <div class="status-bar">
        <div>
            <span id="logCount">0 líneas</span> |
            <span id="lastUpdate">Última actualización: --</span>
        </div>
        <div class="auto-scroll">
            <input type="checkbox" id="autoScroll" checked>
            <label for="autoScroll">Auto-scroll</label>
        </div>
    </div>

    <script>
        let autoRefresh = true;
        let refreshInterval;
        let allLogs = [];

        // Inicializar
        document.addEventListener('DOMContentLoaded', function () {
            refreshLogs();
            startAutoRefresh();
        });

        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(refreshLogs, 5000); // Cada 5 segundos
        }

        function toggleAutoRefresh() {
            autoRefresh = !autoRefresh;
            const btn = document.getElementById('autoRefreshText');

            if (autoRefresh) {
                btn.textContent = '⏸️ Pausar';
                startAutoRefresh();
            } else {
                btn.textContent = '▶️ Reanudar';
                clearInterval(refreshInterval);
            }
        }

        function refreshLogs() {
            // Simular logs del contenedor Docker
            // En producción, esto haría una llamada real a la API de logs
            const mockLogs = generateMockLogs();
            allLogs = mockLogs;
            filterLogs();
            updateStatus();
        }

        function generateMockLogs() {
            const levels = ['INFO', 'WARN', 'ERROR', 'DEBUG'];
            const messages = [
                'Bot iniciado correctamente',
                'Conectado a Telegram API',
                'Conectado a Groq API',
                'Base de datos inicializada',
                'Usuario nuevo registrado: @usuario123',
                'Mensaje procesado correctamente',
                'Generando respuesta motivacional',
                'Backup de base de datos completado',
                'Verificando conectividad...',
                'Sistema funcionando normalmente'
            ];

            const logs = [];
            const now = new Date();

            for (let i = 0; i < 50; i++) {
                const timestamp = new Date(now.getTime() - (i * 60000)); // Cada minuto hacia atrás
                const level = levels[Math.floor(Math.random() * levels.length)];
                const message = messages[Math.floor(Math.random() * messages.length)];

                logs.unshift({
                    timestamp: timestamp.toISOString(),
                    level: level,
                    message: message,
                    raw: `${timestamp.toISOString()} - coach-bot - ${level} - ${message}`
                });
            }

            return logs;
        }

        function filterLogs() {
            const levelFilter = document.getElementById('levelFilter').value;
            const searchFilter = document.getElementById('searchFilter').value.toLowerCase();
            const linesLimit = document.getElementById('linesLimit').value;

            let filteredLogs = allLogs;

            // Filtrar por nivel
            if (levelFilter) {
                filteredLogs = filteredLogs.filter(log => log.level === levelFilter);
            }

            // Filtrar por búsqueda
            if (searchFilter) {
                filteredLogs = filteredLogs.filter(log =>
                    log.message.toLowerCase().includes(searchFilter) ||
                    log.level.toLowerCase().includes(searchFilter)
                );
            }

            // Limitar líneas
            if (linesLimit !== 'all') {
                filteredLogs = filteredLogs.slice(-parseInt(linesLimit));
            }

            displayLogs(filteredLogs);
        }

        function displayLogs(logs) {
            const viewer = document.getElementById('logViewer');

            if (logs.length === 0) {
                viewer.innerHTML = '<div class="no-logs">No hay logs que mostrar con los filtros actuales</div>';
                return;
            }

            const html = logs.map(log => {
                const date = new Date(log.timestamp);
                const timeStr = date.toLocaleTimeString();
                const levelClass = `level-${log.level.toLowerCase()}`;
                const lineClass = `log-line ${log.level.toLowerCase()}`;

                return `<div class="${lineClass}">
                    <span class="timestamp">[${timeStr}]</span>
                    <span class="log-level ${levelClass}">${log.level}</span>
                    ${log.message}
                </div>`;
            }).join('');

            viewer.innerHTML = html;

            // Auto-scroll si está habilitado
            if (document.getElementById('autoScroll').checked) {
                viewer.scrollTop = viewer.scrollHeight;
            }
        }

        function updateStatus() {
            document.getElementById('logCount').textContent = `${allLogs.length} líneas`;
            document.getElementById('lastUpdate').textContent = `Última actualización: ${new Date().toLocaleTimeString()}`;
        }

        function clearLogs() {
            if (confirm('¿Estás seguro de que quieres limpiar la vista de logs?')) {
                allLogs = [];
                document.getElementById('logViewer').innerHTML = '<div class="no-logs">Logs limpiados</div>';
                updateStatus();
            }
        }

        // Atajos de teclado
        document.addEventListener('keydown', function (e) {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key) {
                    case 'r':
                        e.preventDefault();
                        refreshLogs();
                        break;
                    case 'f':
                        e.preventDefault();
                        document.getElementById('searchFilter').focus();
                        break;
                }
            }
        });
    </script>
</body>

</html>
